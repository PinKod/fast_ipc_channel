# Prefix definitions for `benchmark.sh -p`.
#
# Format: name|command (flags are static, defined here per tool).
# Supports {VERSION}, {ROLE}, and {OUTDIR} placeholders in the command
# (ROLE is "producer" or "consumer"; OUTDIR is a persistent per-run
# directory under reports/prefix_output/<timestamp>/, created on demand),
# useful for output file paths so concurrent producer/consumer wrapper
# output doesn't collide and survives after the script exits.
#
# A built-in "none" entry (no wrapper) is always offered in the menu in
# addition to whatever is defined here. Only list tools you actually have
# installed - add/remove/edit freely.

valgrind-memcheck|valgrind --leak-check=full --track-origins=yes --log-file={OUTDIR}/valgrind_{VERSION}_{ROLE}.log
valgrind-quiet|valgrind -q --error-exitcode=99
perf-stat|perf stat -e cycles,instructions,cache-misses,cache-references -o {OUTDIR}/perf_stat_{VERSION}_{ROLE}.log --
perf-record|perf record -g -o {OUTDIR}/perf_{VERSION}_{ROLE}.data --
gdb-batch|gdb --batch -ex run -ex bt --args
strace-count|strace -f -c -o {OUTDIR}/strace_{VERSION}_{ROLE}.log
strace-plain|strace -f -o {OUTDIR}/strace_{VERSION}_{ROLE}.log
