valgrind-memcheck|valgrind --leak-check=full --track-origins=yes --log-file={OUTDIR}/valgrind_{VERSION}_{ROLE}.log
valgrind-quiet|valgrind -q --error-exitcode=99
valgrind-massif|valgrind --tool=massif --pages-as-heap=yes --massif-out-file={OUTDIR}/massif_{VERSION}_{ROLE}.out
perf-stat|perf stat -e cycles,instructions,cache-misses,cache-references -o {OUTDIR}/perf_stat_{VERSION}_{ROLE}.log --
perf-stat-full|perf stat -x, -e cpu_core/cycles/,cpu_core/instructions/,cpu_core/cache-misses/,cpu_core/cache-references/,cpu_core/dTLB-load-misses/,cpu_core/dTLB-store-misses/,cpu_core/iTLB-load-misses/,context-switches,cpu-migrations,page-faults,minor-faults,major-faults -o {OUTDIR}/perf_stat_{VERSION}_{ROLE}.csv --
perf-record|perf record -g -o {OUTDIR}/perf_cycles_{VERSION}_{ROLE}.data --
perf-record-cs|perf record -e context-switches -g -o {OUTDIR}/perf_contextswitches_{VERSION}_{ROLE}.data --
perf-record-tlb|perf record -e cpu_core/dTLB-load-misses/ -c 200 -g -o {OUTDIR}/perf_tlbmiss_{VERSION}_{ROLE}.data --
gdb-batch|gdb --batch -ex run -ex bt --args
strace-count|strace -f -c -o {OUTDIR}/strace_{VERSION}_{ROLE}.log
strace-plain|strace -f -o {OUTDIR}/strace_{VERSION}_{ROLE}.log
